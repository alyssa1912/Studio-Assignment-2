<html>

    <head>
        <title>
            My First Website
        </title>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/buzz/1.2.1/buzz.min.js" ></script>

        <style>
           .row{
                width:720px;
                margin: 10px auto 10px auto ;
                justify-content: center;
           }
           .image-container {
                display: table-cell;
                vertical-align: middle;
                padding:20px;
                align-items: center
           }
            
        </style>

    </head> 

    
    <body style = "background-color: rgb(160, 221, 159);" >
        


        <div class="row">
            <div class="image-container"><img id="icon1" src="img/icon1.png" onmouseover="this.src='img/icon01.png';" onmouseout="this.src='img/icon1.png';" width="200" height="215"/></div>
            <div class="image-container"><img id="icon2" src="img/icon2.png" onmouseover="this.src='img/icon02.png';" onmouseout="this.src='img/icon2.png';" width="205" height="190"/></div>
            <div class="image-container"><img id="icon3" src="img/icon3.png" onmouseover="this.src='img/icon03.png';" onmouseout="this.src='img/icon3.png';" width="200" height="175"/></div>
        </div>
        
        <div class="row">
            <div class="image-container"><img id="icon4" src="img/icon4.png" onmouseover="this.src='img/icon04.png';" onmouseout="this.src='img/icon4.png';" width="210" height="195"/></div>
            <div class="image-container"><img id="icon5" src="img/icon5.png" onmouseover="this.src='img/icon05.png';" onmouseout="this.src='img/icon5.png';" width="220" height="180"/></div>
            <div class="image-container"><img id="icon6" src="img/icon6.png" onmouseover="this.src='img/icon06.png';" onmouseout="this.src='img/icon6.png';" width="200" height="200"/></div>
        </div>

        <div class="row">
            <div class="image-container"><img id="icon7" src="img/icon7.png" onmouseover="this.src='img/icon07.png';" onmouseout="this.src='img/icon7.png';" width="195" height="180"/></div>
            <div class="image-container"><img id="icon8" src="img/icon8.png" onmouseover="this.src='img/icon08.png';" onmouseout="this.src='img/icon8.png';" width="200" height="195"/></div>
            <div class="image-container"><img id="icon9" src="img/icon9.png" onmouseover="this.src='img/icon09.png';" onmouseout="this.src='img/icon9.png';" width="230" height="185"/></div>
        </div>



       

        <script>
            var sound1 = new buzz.sound("sound/sound1.wav");
            var sound2 = new buzz.sound("sound/sound2.wav");
            var sound3 = new buzz.sound("sound/sound3.wav");
            var sound4 = new buzz.sound("sound/sound4.wav");
            var sound5 = new buzz.sound("sound/sound5.wav");
            var sound6 = new buzz.sound("sound/sound6.wav");
            var sound7 = new buzz.sound("sound/sound7.wav");
            var sound8 = new buzz.sound("sound/sound8.wav");
            var sound9 = new buzz.sound("sound/sound9.wav");

            window.onload = function() {
                document.getElementById('icon1').addEventListener('mouseover', function () {sound1.play();});
                document.getElementById('icon2').addEventListener('mouseover', function () {sound2.play();});
                document.getElementById('icon3').addEventListener('mouseover', function () {sound3.play();});
                document.getElementById('icon4').addEventListener('mouseover', function () {sound4.play();});
                document.getElementById('icon5').addEventListener('mouseover', function () {sound5.play();});
                document.getElementById('icon6').addEventListener('mouseover', function () {sound6.play();});
                document.getElementById('icon7').addEventListener('mouseover', function () {sound7.play();});
                document.getElementById('icon8').addEventListener('mouseover', function () {sound8.play();});
                document.getElementById('icon9').addEventListener('mouseover', function () {sound9.play();});
            };
         </script>
       
       
    </body>

</html>
